    "id": "u17944990885127",
    "date": "2025-11-18",
    "title": "<anan>拍摄幕后记事",
    "tag": "杂志",
    "summary": "【为纪念\"美搭\"第二季，奥野壮先生 & 丰田裕大先生再度降临《anan》！】",
    "body": [
      "【为纪念\"美搭\"第二季，奥野壮先生 & 丰田裕大先生再度降临《anan》！】",
      "我负责策划了邀请主演明年1月开播的电视剧《美妆搭档情人 Season2》的奥野壮先生 & 丰田裕大先生登场的Close up企划。",
      "【本次以\"工作模式与生活模式（on/off）\"为主题，拍摄了仅属于他们二人的特别瞬间。】",
      "上次登场特辑获得众多粉丝热烈反响。拍摄前当我询问\"两位是否也听到了大家的反响呢？\"，得到了\"反响超级热烈！\"的珍贵回应。奥野先生表示\"能再次两人共同出演很开心呢\"，丰田先生便笑着回应\"嗯，很开心\"。从拍摄前就默契十足、氛围融洽的两人，让全体工作人员都不禁露出微笑！在和谐的氛围中，拍摄正式开始。",
      "本次以\"工作模式/生活模式（on/off）\"为主题，拍摄了仅属于他们二人的特别瞬间。首先拍摄的第一组造型，是象征工作模式（on）的时尚黑白西装造型。通过松开领带、刻意不穿好外套等穿搭方式，保留了几分不羁感。由于按照奥野先生→丰田先生的顺序进行单人拍摄，当我们告知奥野先生\"（在丰田先生拍摄时）请在影棚稍等\"，他立刻表示\"我想看模特状态下的丰田裕大（笑）\"。看着监视器的奥野先生连连赞叹\"真不愧是\"\"好帅\"，让丰田先生露出了羞涩表情。这段温馨互动让影棚充满了温暖笑声。",
      "紧接着进行双人拍摄。时而指尖相触背靠背，时而丰田先生搂住奥野先生肩膀，时而奥野先生将下巴轻抵丰田先生肩头，两人以惊人默契不断变换姿势。这正是完成第二季拍摄后，能感受到二人羁绊愈发深厚的瞬间。最后还尝试了将彼此领带末端系在一起的吸睛镜头。虽然需要反复\"微调\"领带位置与长度，但两位始终愉快配合。成片效果敬请通过杂志确认，务必关注二人新鲜的表情与姿态。",
      "【仿佛窥见私密时光？共撑一伞的生活风镜头。】",
      "随后拍摄的是象征生活模式（off）的场景。奥野先生身着运动夹克&尼龙裤，丰田先生则穿 polo 衫&运动裤，造型营造出窥见两人真实\"拍摄后\"状态的氛围。虽然外景拍摄遇上下雨...但团队巧妙利用雨景，拍摄了共撑透明雨伞倚靠护栏、共饮罐装咖啡等近乎素颜的状态。返回影棚时共撑一伞的两人，当工作人员提醒\"这边有伞...\"时，他们相视而笑\"啊都没注意到\"，瞬间流露的默契令人会心一笑。在影棚前停车场的拍摄中，还捕捉了长椅自然交谈、共享有线耳机听音乐等动人镜头。他们究竟在聊什么？听着什么音乐？敬请读者带着想象翻阅杂志。",
      "访谈不仅深入探讨作品看点，更揭秘了\"前天突然接到\"的\"初次电话\"等趣味话题。这套令人对明年一月开播更添期待的特别写真&访谈，敬请期待。（S.K）"
    ],

function renderPicker(){
  let vy=state.year,vm=state.month;if(vy!==null&&!vm)vm=latestMonthInYear(vy);if(vy===null){const t=lastEntryYM();if(t){vy=t.y;vm=t.m}else{const n=new Date();vy=n.getFullYear();vm=n.getMonth()+1}}
  el("selY").innerHTML=`<option value="all">全部年份</option>`+years.map(y=>`<option value="${y}" ${y===state.year?"selected":""}>${y} 年</option>`).join("");el("selY").value=state.year===null?"all":state.year;el("selM").innerHTML=[...Array(12)].map((_,i)=>`<option value="${i+1}" ${i+1===vm?"selected":""}>${i+1} 月</option>`).join("");el("selM").value=vm;
  const box=el("days");const first=new Date(vy,vm-1,1);const startPad=(first.getDay()+6)%7;const dim=new Date(vy,vm,0).getDate();const prevDim=new Date(vy,vm-1,0).getDate();const now=new Date(),todayKey=toKey(now.getFullYear(),now.getMonth()+1,now.getDate());let html="";
  for(let i=startPad-1;i>=0;i--)html+=`<div class="day muted">${prevDim-i}</div>`;
  for(let d=1;d<=dim;d++){const key=toKey(vy,vm,d);const dayItems=byDate[key]||[];const has=dayItems.some(item=>matches(item,state.query));const isToday=key===todayKey;const sel=state.day===d&&state.year===vy&&state.month===vm;if(!has){html+=`<div class="day none${isToday?" today":""}">${d}</div>`;continue}html+=`<div class="day has${isToday?" today":""}${sel?" sel":""}" data-d="${d}" role="button" tabindex="0">${d}<span class="dot"></span></div>`}
  const rest=(7-((startPad+dim)%7))%7;for(let i=1;i<=rest;i++)html+=`<div class="day muted">${i}</div>`;box.innerHTML=html;
  box.querySelectorAll(".day[data-d]").forEach(n=>{const pick=()=>{const d=+n.dataset.d;state.year=vy;state.month=vm;state.day=state.day===d?null:d;renderAll()};n.onclick=pick;n.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}}});
  const mc=sorted.filter(i=>i.date.startsWith(`${vy}-${pad(vm)}`)).length;el("jumpStat").textContent=state.day?`当日 ${(byDate[toKey(vy,vm,state.day)]||[]).length} 页`:`本月 ${mc} 页`;el("clearDay").style.visibility=state.day?"visible":"hidden";
}
function renderYearbar(){
  const counts={};sorted.forEach(i=>{const y=i.date.slice(0,4);counts[y]=(counts[y]||0)+1});
  el("yearbar").innerHTML=`<button class="yr ${state.year===null?"on":""}" data-y="all">全部<span class="n">${DATA.length}</span></button><div class="yr-sep"></div>`+years.map(y=>`<button class="yr ${state.year===y?"on":""}" data-y="${y}">${y}<span class="n">${counts[y]||0}</span></button>`).join("")+`<button class="sort-btn" id="sortBtn">${state.sortAsc?"由远及近 ↓":"由近及远 ↑"}</button>`;
  el("yearbar").querySelectorAll(".yr").forEach(b=>{b.onclick=()=>{const v=b.dataset.y;if(v==="all"){state.year=null;state.month=null;state.day=null}else{state.year=+v;state.month=null;state.day=null}renderAll()}});
  el("sortBtn").onclick=()=>{state.sortAsc=!state.sortAsc;renderYearbar();renderRail();renderMain()};
}
function renderRail(){
  const q=state.query.trim(),box=el("railList");const list=sorted.filter(i=>{if(state.year!==null&&+i.date.slice(0,4)!==state.year)return false;if(state.month&&+i.date.slice(5,7)!==state.month)return false;return matches(i,q)});
  el("railCount").innerHTML=q?`命中 <b>${list.length}</b> / ${DATA.length}`:`共 <b>${DATA.length}</b> 页`;
  if(!list.length){box.innerHTML=`<div class="tl-empty">这一段时间里还没有手帖。<br/>试试放大年份，或清空搜索。</div>`;return}
  const ordered=state.sortAsc?list:[...list].reverse();const groups={};ordered.forEach(i=>{const k=i.date.slice(0,7);(groups[k]=groups[k]||[]).push(i)});
  box.innerHTML=Object.keys(groups).map(k=>{const[y,m]=k.split("-");return `<div class="month-label">${y} · ${+m} 月<span class="mc">${groups[k].length} 页</span></div><div class="tl-group">`+groups[k].map(item=>{const d=+item.date.slice(8);const act=(state.day===d&&state.year===+y&&state.month===+m)?" active":"";return `<button class="tl-item${act}" data-id="${esc(item.id)}"><span class="d mono">${pad(d)}</span><span class="t">${esc(item.title)}</span></button>`}).join("")+`</div>`}).join("");
  const items=box.querySelectorAll(".tl-item");items.forEach((b,i)=>{b.style.animationDelay=Math.min(i*32,420)+"ms"});items.forEach(b=>{b.onclick=()=>{const item=DATA.find(i=>i.id===b.dataset.id);if(!item)return;const p=parseKey(item.date);state.year=p.y;state.month=p.m;state.day=p.d;renderAll();openPreview(item.id)}});
  const act=box.querySelector(".tl-item.active");if(act)try{act.scrollIntoView({block:"nearest"})}catch(e){}
}
function currentScope(){const q=state.query.trim();let list=sorted.filter(i=>{if(state.year!==null&&+i.date.slice(0,4)!==state.year)return false;if(state.month&&+i.date.slice(5,7)!==state.month)return false;if(state.month&&state.day)return +i.date.slice(8)===state.day;return true}).filter(i=>matches(i,q));return state.sortAsc?list:[...list].reverse()}
function renderMain(){
  const list=currentScope();state.currentList=list;const q=state.query.trim();let h1,sub;
  if(state.year===null){h1=`全部手帖 <span class="num">${list.length}</span>`;sub=years.length?`${years[0]} — ${years[years.length-1]}，慢慢翻。`:""}
  else if(!state.month){h1=`<span class="num">${state.year}</span> 年 <span class="num">${list.length}</span>`;sub="这一年的所有记录"}
  else if(!state.day){h1=`<span class="num">${state.year}</span> 年 ${state.month} 月 <span class="num">${list.length}</span>`;sub="整月视图 · 点日历上的日子可只看当天"}
  else{const wd=WEEK[new Date(state.year,state.month-1,state.day).getDay()];h1=`${state.year} 年 ${state.month} 月 <span class="num">${state.day}</span> 日`;sub=`${wd}<i>|</i>当日共 ${list.length} 页`}
  el("h1").innerHTML=h1;el("sub").innerHTML=q?`${sub}<i>|</i>搜索「${esc(q)}」`:sub;
  const cards=el("cards");if(!list.length){cards.innerHTML=`<div class="empty"><div class="t">这里还空着</div><div class="s">这一段时间里还没有手帖。</div><button class="btn btn-ghost" id="emptyReset">回到全部</button></div>`;el("emptyReset").onclick=()=>{state.year=null;state.month=null;state.day=null;state.query="";el("q").value="";renderAll()};return}
  cards.innerHTML=list.map(item=>`<div class="card" data-id="${esc(item.id)}" role="button" tabindex="0"><div class="card-tape"></div><div class="card-img"><span class="card-tag">${esc(item.tag||"記録")}</span><img src="${imgOf(item)}" alt="${esc(item.title)}" loading="lazy"/></div><div class="card-date mono">${item.date.replace(/-/g," . ")}</div><h3>${esc(item.title)}</h3><p>${esc(item.summary)}</p><div class="card-foot"><span>${esc(item.place||"")}</span><span class="sep"></span><span>${esc(item.source||"")}</span></div></div>`).join("");
  cards.querySelectorAll(".card").forEach(node=>{node.onclick=()=>openPreview(node.dataset.id);node.onkeydown=e=>{if(e.key==="Enter")openPreview(node.dataset.id)}});revealCards(cards);
}
function revealCards(cards){const nodes=cards.querySelectorAll(".card");if(!("IntersectionObserver" in window)){nodes.forEach(n=>n.classList.add("in"));return}const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const n=en.target;if(n.dataset.seen){n.classList.add("in");io.unobserve(n);return}n.dataset.seen="1";const d=+n.dataset.dd||0;setTimeout(()=>n.classList.add("in"),d);io.unobserve(n)}})},{threshold:.08,rootMargin:"0px 0px -4% 0px"});nodes.forEach((n,i)=>{if(n.dataset.seen){n.classList.add("in");return}n.dataset.dd=(i%8)*55;io.observe(n)})}
function openPreview(id){const list=state.currentList.length?state.currentList:currentScope();const idx=list.findIndex(i=>i.id===id);if(idx<0)return;state.currentList=list;state.currentIndex=idx;paintPreview();el("ov").classList.add("open");document.body.style.overflow="hidden"}
function paintPreview(){
  const item=state.currentList[state.currentIndex];if(!item)return;const p=parseKey(item.date),wd=WEEK[new Date(p.y,p.m-1,p.d).getDay()];const im=el("ovImg");im.src=imgOf(item);im.alt=item.title;im.style.animation="none";try{void im.offsetWidth}catch(e){};im.style.animation="";
  el("ovStamp").textContent=`${p.y}.${pad(p.m)}.${pad(p.d)}`;el("ovDate").textContent=`${p.y} 年 ${p.m} 月 ${p.d} 日 · ${wd}`;el("ovTitle").textContent=item.title;el("ovMeta").innerHTML=`<span>分类<b>${esc(item.tag||"—")}</b></span><span>地点<b>${esc(item.place||"—")}</b></span><span>出处<b>${esc(item.source||"—")}</b></span>`;
  el("ovBody").innerHTML=(item.body||[]).map((t,i)=>i===1?`<blockquote>${esc(t)}</blockquote>`:`<p>${esc(t)}</p>`).join("");el("ovExtra").innerHTML=[item.img,...(item.imgs||[])].filter(Boolean).map(u=>`<figure><img src="${esc(u)}" alt="" loading="lazy"/></figure>`).join("");el("ovTags").innerHTML=[item.tag,item.place,`${p.y} 年`,`${p.m} 月`].filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join("");
  el("ovIdx").textContent=`${state.currentIndex+1} / ${state.currentList.length}`;el("ovPrev").disabled=state.currentIndex===0;el("ovNext").disabled=state.currentIndex===state.currentList.length-1;el("ovScroll").scrollTop=0;
}
function closePreview(){el("ov").classList.remove("open");document.body.style.overflow=""}
function stepPreview(d){const n=state.currentIndex+d;if(n<0||n>=state.currentList.length)return;state.currentIndex=n;paintPreview()}
el("selY").onchange=e=>{const v=e.target.value;if(v==="all"){state.year=null;state.month=null;state.day=null}else{state.year=+v;state.month=null;state.day=null}renderAll()};
el("selM").onchange=e=>{const v=+e.target.value;if(!v)return;if(state.year===null){const t=lastEntryYM();state.year=t?t.y:new Date().getFullYear()}state.month=v;state.day=null;renderAll()};
el("prevM").onclick=()=>{if(state.year===null){const t=lastEntryYM();if(!t)return;state.year=t.y;state.month=t.m}if(state.month===1){state.year--;state.month=12}else state.month--;state.day=null;renderAll()};
el("nextM").onclick=()=>{if(state.year===null){const t=lastEntryYM();if(!t)return;state.year=t.y;state.month=t.m}if(state.month===12){state.year++;state.month=1}else state.month++;state.day=null;renderAll()};
el("clearDay").onclick=()=>{state.day=null;renderAll()};
el("btnToday").onclick=()=>{const n=new Date();state.year=n.getFullYear();state.month=n.getMonth()+1;state.day=n.getDate();renderAll();toast("已跳到今天")};
el("btnRandom").onclick=()=>{if(!DATA.length)return;const item=DATA[Math.floor(Math.random()*DATA.length)];const p=parseKey(item.date);state.year=p.y;state.month=p.m;state.day=p.d;state.query="";el("q").value="";renderAll();openPreview(item.id)};
el("q").oninput=e=>{state.query=e.target.value;state.day=null;renderRail();renderMain()};
el("ovClose").onclick=closePreview;el("ov").onclick=e=>{if(e.target.id==="ov")closePreview()};el("ovPrev").onclick=()=>stepPreview(-1);el("ovNext").onclick=()=>stepPreview(1);
el("ovCopy").onclick=async()=>{const item=state.currentList[state.currentIndex];if(!item)return;let txt=`${item.title}\n${item.date} · ${item.place||""}`;if(item.tag)txt=`【${item.tag}】`+txt;txt+=`\n\n${(item.body||[]).join("\n\n")}`;try{await navigator.clipboard.writeText(txt);toast("文案已复制"+(item.tag?"（含分类）":""))}catch{toast("复制失败，请手动选择文字")}};
document.addEventListener("keydown",e=>{if(el("ov").classList.contains("open")){if(e.key==="Escape")closePreview();if(e.key==="ArrowRight")stepPreview(1);if(e.key==="ArrowLeft")stepPreview(-1);return}if(e.key==="/"&&document.activeElement.id!=="q"){e.preventDefault();el("q").focus()}});
function renderAll(){renderPicker();renderYearbar();renderRail();renderMain()}
reindex();if(sorted.length){const p=parseKey(sorted[sorted.length-1].date);state.year=p.y;state.month=p.m}renderAll();
(function(){const bar=el("prog");if(!bar)return;const onScroll=()=>{try{const h=document.documentElement;const max=h.scrollHeight-h.clientHeight;bar.style.width=(max>0?(h.scrollTop||document.body.scrollTop)/max*100:0)+"%" }catch(e){}};window.addEventListener("scroll",onScroll,{passive:true});onScroll()})();
</script>
</body>
</html>
